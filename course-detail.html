<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Details | Sunshine Techno System</title>
    <meta
      name="description"
      content="Detailed course information — syllabus overview, training mode and enquiry for IT courses at Sunshine Techno System, Hyderabad."
    />
    <meta
      property="og:title"
      content="Course Details | Sunshine Techno System"
    />
    <meta
      property="og:description"
      content="Detailed course information at Sunshine Techno System, Hyderabad."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0e1729" />

    <!-- Favicon Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
    <link rel="shortcut icon" href="assets/favicon_io/favicon.ico" />
    <link rel="manifest" href="assets/favicon_io/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="main-content" id="main">
      <!-- Dynamic content injected by JS -->
      <div id="course-detail-root"></div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="floating-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/cursor.js"></script>
    <script>
      renderHeader();
      renderFooter();
      renderFloatingActions();

      const root = document.getElementById('course-detail-root');

      // Read slug from URL
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      // Find course
      const course = courses.find((c) => c.slug === slug);

      if (!course) {
        // 404 state
        root.innerHTML = `
        <section class="page-hero">
          <div class="page-hero-bg">
            <div class="page-hero-blob1"></div>
            <div class="page-hero-blob2"></div>
          </div>
          <div class="container-page page-hero-content">
            <div class="page-hero-eyebrow">404</div>
            <h1>Course Not Found</h1>
            <p class="page-hero-subtitle">The course you're looking for doesn't exist or may have moved.</p>
          </div>
        </section>
        <section class="section-py">
          <div class="container-page" style="text-align:center">
            <a href="courses.html" class="btn btn-hero btn-lg" id="back-to-courses-btn">
              Browse All Courses
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:1rem;height:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
            </a>
          </div>
        </section>
      `;
      } else {
        // Update page title
        document.title =
          course.title + ' Training | Sunshine Techno System, Hyderabad';
        document
          .querySelector('meta[name="description"]')
          .setAttribute(
            'content',
            course.title +
              ' training at Sunshine Techno System — ' +
              course.description +
              ' Available as ' +
              course.mode +
              '.',
          );

        const iconSvg = courseIconSVGs[course.icon] || courseIconSVGs['code'];

        // Related courses (same category, max 4, exclude current)
        const related = courses
          .filter(
            (c) => c.category === course.category && c.slug !== course.slug,
          )
          .slice(0, 4);

        root.innerHTML = `
        <!-- PAGE HERO -->
        ${renderPageHero(course.category, course.title, course.description)}

        <!-- COURSE DETAIL MAIN -->
        <section class="section-py" id="course-detail-main">
          <div class="container-page two-col-contact">

            <!-- LEFT: Course info -->
            <div>
              <div class="course-detail-card">
                <div class="course-detail-icon-wrap">
                  <div class="course-card-icon" style="width:3.5rem;height:3.5rem">${iconSvg}</div>
                  <span class="course-badge" style="font-size:.875rem">${course.category}</span>
                </div>
                <h2 style="font-size:1.75rem;font-weight:800;color:var(--fg);margin:1rem 0 .5rem">${course.title}</h2>
                <p style="color:var(--muted-fg);font-size:1rem;line-height:1.7;margin-bottom:1.25rem">${course.description}</p>

                <div class="course-detail-meta-row">
                  <div class="course-detail-meta-item">
                    ${icons.mapPin}
                    <span><strong>Mode:</strong> ${course.mode}</span>
                  </div>
                  <div class="course-detail-meta-item">
                    ${featureIconSVGs.clock}
                    <span><strong>Batches:</strong> Weekday &amp; Weekend</span>
                  </div>
                  <div class="course-detail-meta-item">
                    ${featureIconSVGs.users}
                    <span><strong>Audience:</strong> Students &amp; Professionals</span>
                  </div>
                </div>

                <div style="margin-top:1.5rem">
                  <h3 style="font-size:1.125rem;font-weight:700;color:var(--fg);margin-bottom:1rem">What You'll Get</h3>
                  <ul class="checklist">
                    <li class="checklist-item">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Practical, hands-on training sessions
                    </li>
                    <li class="checklist-item">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Real-time scenarios and live examples
                    </li>
                    <li class="checklist-item">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Individual doubt support and attention
                    </li>
                    <li class="checklist-item">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Classroom &amp; live online options
                    </li>
                    <li class="checklist-item">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Career-oriented preparation
                    </li>
                  </ul>
                </div>

                <div style="margin-top:2rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem">
                  <a href="courses.html" class="btn btn-outline btn-md" id="back-courses-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:1rem;height:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                    All Courses
                  </a>
                  <a href="contact.html" class="btn btn-sunshine btn-md" id="course-detail-enquire-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:1.125rem;height:1.125rem"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/></svg>
                    Enquire About This Course
                  </a>
                </div>
              </div>
            </div>

            <!-- RIGHT: Enquiry form -->
            <div>
              <h2 style="font-size:1.25rem;font-weight:700;color:var(--fg);margin-bottom:.5rem">Book a Free Demo</h2>
              <p style="color:var(--muted-fg);font-size:.875rem;margin-bottom:1.25rem">
                Interested in <strong>${course.title}</strong>? Share your details and we'll get back to you.
              </p>
              <div id="enquiry-form-course-detail"></div>
            </div>

          </div>
        </section>

        <!-- RELATED COURSES -->
        ${
          related.length > 0
            ? `
        <section class="bg-muted-50 section-py" id="related-courses">
          <div class="container-page">
            <div id="related-courses-header"></div>
            <div class="courses-grid-3col" id="related-courses-grid" style="margin-top:2rem"></div>
          </div>
        </section>
        `
            : ''
        }
      `;

        // Render enquiry form
        renderEnquiryForm('enquiry-form-course-detail');

        // Pre-select course in form if possible
        const courseSelect = document.getElementById(
          'ef-course-enquiry-form-course-detail',
        );
        if (courseSelect) {
          const opt = Array.from(courseSelect.options).find(
            (o) => o.value === course.title,
          );
          if (opt) opt.selected = true;
        }

        // Related courses
        if (related.length > 0) {
          document.getElementById('related-courses-header').innerHTML =
            renderSectionHeader(
              course.category,
              'Related Courses',
              'Other ' +
                course.category +
                ' training courses you might be interested in.',
            );
          document.getElementById('related-courses-grid').innerHTML = related
            .map(renderCourseCard)
            .join('');
        }
      }
    </script>
  </body>
</html>
