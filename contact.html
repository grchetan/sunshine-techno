<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Sunshine Techno System | Lingampally, Hyderabad</title>
  <meta name="description" content="Contact Sunshine Techno System at Lingampally, Hyderabad for IT training enquiries, demo bookings and course details. Classroom + online training available." />
  <meta property="og:title" content="Contact Sunshine Techno System | Lingampally, Hyderabad" />
  <meta property="og:description" content="Contact Sunshine Techno System at Lingampally, Hyderabad for IT training enquiries, demo bookings and course details. Classroom + online training available." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0e1729" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="main-content" id="main">

    <!-- PAGE HERO -->
    <div id="page-hero-contact"></div>

    <!-- CONTACT SECTION -->
    <section class="section-py" id="contact-section">
      <div class="container-page two-col-contact">

        <!-- LEFT: Info + Map -->
        <div id="contact-info-col"></div>

        <!-- RIGHT: Enquiry Form -->
        <div>
          <h2 style="font-size:1.5rem;font-weight:800;color:var(--fg);margin-bottom:.5rem">Send an Enquiry</h2>
          <p style="color:var(--muted-fg);font-size:.9375rem;margin-bottom:1.5rem">
            Fill in the form and our team will get back to you with course details and batch schedules.
          </p>
          <div id="enquiry-form-contact"></div>
        </div>

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>
  <div id="floating-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script>
    renderHeader();
    renderFooter();
    renderFloatingActions();

    // Page Hero
    document.getElementById('page-hero-contact').innerHTML = renderPageHero(
      'Contact',
      'Start Your Learning Journey',
      'Reach out for course details, batch schedules, demo bookings or any other questions.'
    );

    // Google Maps directions URL
    const mapsDirectionsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent('Hema Durga Complex, Lingampally, BHEL X Road, Hyderabad, Telangana 500050');

    // Contact info col
    document.getElementById('contact-info-col').innerHTML = `
      <div class="contact-info-card">
        <h2 style="font-size:1.5rem;font-weight:800;color:var(--fg);margin-bottom:1.5rem">${siteConfig.name}</h2>

        <div class="contact-row">
          <div class="contact-row-icon">${icons.mapPin}</div>
          <div class="contact-row-content">
            <div class="contact-row-label">Address</div>
            <div class="contact-row-value">
              ${siteConfig.address.line1},<br>
              ${siteConfig.address.line2},<br>
              ${siteConfig.address.city} — ${siteConfig.address.pin}
            </div>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-row-icon">${icons.phone}</div>
          <div class="contact-row-content">
            <div class="contact-row-label">Phone</div>
            <div class="contact-row-value">
              <a href="tel:${siteConfig.phone}" style="color:var(--fg);text-decoration:none">${siteConfig.phoneDisplay}</a>
            </div>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-row-icon">${icons.mail}</div>
          <div class="contact-row-content">
            <div class="contact-row-label">Email</div>
            <div class="contact-row-value">
              <a href="mailto:${siteConfig.email}" style="color:var(--fg);text-decoration:none;word-break:break-all">${siteConfig.email}</a>
            </div>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-row-icon">${icons.messageCircle}</div>
          <div class="contact-row-content">
            <div class="contact-row-label">WhatsApp</div>
            <div class="contact-row-value">
              <a href="https://wa.me/${siteConfig.whatsapp.replace(/\\D/g,'')}?text=${encodeURIComponent("Hi Sunshine Techno System, I'd like to enquire about a course.")}"
                 target="_blank" rel="noopener noreferrer" style="color:var(--fg);text-decoration:none">
                Chat on WhatsApp
              </a>
            </div>
          </div>
        </div>

        <div class="contact-action-btns">
          <a href="${mapsDirectionsUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-hero" id="get-directions-btn">
            Get Directions
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:1rem;height:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
          </a>
          <a href="https://sunshinetechnosystem.com" target="_blank" rel="noopener noreferrer" class="btn btn-outline" id="visit-website-btn">Visit Website</a>
        </div>

        <div class="map-frame" style="margin-top:1.75rem">
          <iframe
            src="https://www.google.com/maps?q=Hema+Durga+Complex+Lingampally+BHEL+X+Road+Hyderabad+Telangana+500050&output=embed"
            width="100%"
            height="320"
            style="border:0;border-radius:.75rem;display:block"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Sunshine Techno System location map"
          ></iframe>
        </div>
      </div>
    `;

    // Enquiry form
    renderEnquiryForm('enquiry-form-contact');
  </script>
</body>
</html>
