<!doctype html>

    <title>About Sunshine Techno System | IT Training in Hyderabad</title>
    <meta
      name="description"

    />
    <meta
      property="og:title"
      content="About Sunshine Techno System | IT Training in Hyderabad"
    />
    <meta
      property="og:description"

    <meta property="og:type" content="website" />

  <body>
    <div id="header-placeholder"></div>

      <!-- PAGE HERO (Creative Hand-Drawn Marker & Sketch Style) -->

        <!-- Edge Tech Doodles -->

          <svg
            viewBox="0 0 120 220"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M 20 20 L 40 10 L 60 20" />
            <text
              x="10"
              y="55"
              fill="none"
              stroke="#f5c842"

              &lt;/&gt;

            <path d="M 20 80 Q 40 70 60 80 Q 80 90 100 80" />
            <rect x="15" y="110" width="45" height="30" rx="4" />
            <path d="M 25 125 L 35 125 M 42 125 L 50 125" />
            <circle cx="80" cy="160" r="18" stroke-dasharray="4 3" />
            <path d="M 15 190 Q 45 170 85 195" />

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"
                />

              ABOUT US

            <h1 class="about-hero-title">
              <span class="about-hero-title-line1">Learn Technology</span>
              <span class="about-hero-title-line2">
                the Practical Way
                <svg
                  class="about-wavy-underline"
                  viewBox="0 0 300 20"
                  preserveAspectRatio="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M 5 12 Q 25 3, 45 12 T 85 12 T 125 12 T 165 12 T 205 12 T 245 12 T 285 12 T 295 10"
                  />
                </svg>

            </h1>

            <p class="about-hero-desc">
              An IT and software training institute in Hyderabad focused on
              hands-on learning and career preparation.
            </p>
          </div>

          <!-- Right Column: Hand-Drawn Programmer Line-Art Artwork -->
          <div class="about-hero-illustration-wrap">
            <svg
              class="about-hero-sketch-art"
              viewBox="0 0 420 380"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"

              <!-- Background doodle cluster glow/ring -->
              <circle

                stroke="rgba(245,200,66,0.18)"

              <rect
                x="160"
                y="218"
                width="100"

                rx="4"

              />
              <!-- Code on screen -->
              <path
                d="M 172 235 L 184 243 L 172 251"
                stroke="#f5c842"

              <line

              <line

                y1="265"
                x2="245"
                y2="265"
                stroke="rgba(255,255,255,0.6)"
                stroke-width="2"
                stroke-linecap="round"
              />

              <!-- Person Line-Art (Hand-drawn Programmer) -->
              <!-- Head & Glasses -->
              <circle
                cx="210"
                cy="115"
                r="32"
                stroke="#f7f9fd"
                stroke-width="3"
                fill="rgba(14,23,41,0.85)"
              />
              <circle
                cx="198"
                cy="112"
                r="10"
                stroke="#f5c842"
                stroke-width="2.5"
              />
              <circle
                cx="222"
                cy="112"
                r="10"
                stroke="#f5c842"
                stroke-width="2.5"
              />
              <line
                x1="208"
                y1="112"
                x2="212"
                y2="112"
                stroke="#f5c842"
                stroke-width="2.5"
              />
              <!-- Smile -->
              <path
                d="M 202 128 Q 210 136 218 128"
                stroke="#f7f9fd"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <!-- Hair -->
              <path
                d="M 185 100 Q 210 80 235 100"
                stroke="#f5c842"
                stroke-width="3"
                stroke-linecap="round"
              />

              <!-- Body / Hoodie -->
              <path
                d="M 170 170 Q 210 145 250 170 L 260 230 L 160 230 Z"
                stroke="#3b6fd4"
                stroke-width="3"
                fill="rgba(59,111,212,0.18)"
                stroke-linejoin="round"
              />

              <!-- Arms typing on laptop -->
              <path
                d="M 170 175 Q 150 220 185 240"
                stroke="#f7f9fd"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path
                d="M 250 175 Q 270 220 235 240"
                stroke="#f7f9fd"
                stroke-width="3"
                stroke-linecap="round"
              />

              <!-- Floating Tech Doodles around character -->
              <!-- Cloud with AWS -->
              <g opacity="0.85">
                <path
                  d="M 70 110 Q 60 95 75 85 Q 90 75 105 85 Q 120 85 120 100 Q 125 115 110 120 Q 90 125 70 110 Z"
                  stroke="#a0c0f8"

                />
                <text

                  y="103"
                  fill="#f5c842"
                  font-size="11"
                  font-weight="bold"
                  font-family="'Manrope', sans-serif"
                >
                  AWS
                </text>
              </g>

              <!-- Code brackets { } -->
              <text
                x="45"
                y="180"
                fill="#f5c842"

                { }

              <text

                &lt;/&gt;

              <!-- Database Cylinder Doodle -->

                <path
                  d="M 320 195 Q 340 205 360 195"

              <!-- Graduation Cap -->

                <polygon
                  points="120,50 150,38 180,50 150,62"
                  stroke="#f5c842"

                  d="M 130 55 L 130 72 Q 150 80 170 72 L 170 55"
                  stroke="#f5c842"
                  stroke-width="2"
                />
                <path
                  d="M 180 50 L 188 68"
                  stroke="#f7f9fd"
                  stroke-width="1.8"
                />
              </g>

              <!-- Lightbulb / Idea sparks -->
              <g opacity="0.9">
                <path
                  d="M 210 35 A 12 12 0 1 0 202 52 L 218 52 A 12 12 0 0 0 210 35 Z"
                  stroke="#f5c842"
                  stroke-width="2"
                  fill="rgba(245,200,66,0.15)"
                />
                <line
                  x1="210"
                  y1="15"
                  x2="210"
                  y2="22"
                  stroke="#f5c842"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="190"
                  y1="28"
                  x2="196"
                  y2="33"
                  stroke="#f5c842"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="228"
                  y1="28"
                  x2="222"
                  y2="33"
                  stroke="#f5c842"
                  stroke-width="2"

                />
              </g>

              <!-- Sparkle Stars -->
              <path
                d="M 300 65 L 303 72 L 310 75 L 303 78 L 300 85 L 297 78 L 290 75 L 297 72 Z"

              />
              <path
                d="M 80 230 L 82 235 L 87 237 L 82 239 L 80 244 L 78 239 L 73 237 L 78 235 Z"

          </div>
        </div>
      </section>

      <!-- ABOUT TWO-COL -->
      <section class="section-py" id="about-main">
        <div class="container-page two-col">
          <!-- Left: image -->
          <div class="about-image-wrap">
            <div class="about-img-frame">
              <img
                src="assets/about-classroom.jpg"
                alt="Trainer teaching at Sunshine Techno System classroom in Hyderabad"
                width="1200"
                height="900"
                loading="lazy"
              />
            </div>
          </div>

          <!-- Right: content -->
          <div id="about-right-content"></div>
        </div>
      </section>

      <!-- INFO CARDS -->
      <section class="bg-muted-50 section-py-sm" id="about-info-cards">
        <div class="container-page">
          <div class="info-cards-grid" id="info-cards-grid"></div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <div id="floating-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script src="js/cursor.js"></script>
    <script>
      renderHeader();
      renderFooter();
      renderFloatingActions();

      // About right content
      const aboutPoints = [
        'Experienced Trainers',
        'Practical Learning',
        'Real-Time Scenarios',
        'Live Projects',
        'Flexible Timings',
        'Online & Classroom',
        'Individual Attention',
        'Career-Oriented Training',
      ];
      document.getElementById('about-right-content').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:1rem;font-size:1rem;line-height:1.7;color:var(--muted-fg)">
        <p>Sunshine Techno System is an IT and software training institute serving students, freshers and working professionals in Hyderabad.</p>
        <p>The institute focuses on practical learning, technical fundamentals, real-time scenarios and hands-on experience across programming, software testing, SAP, data science, cloud technologies and modern development tools.</p>
        <p>Training is available through classroom and online learning options, allowing learners to choose flexible schedules that suit students and working professionals alike.</p>
      </div>
      <ul class="checklist" style="margin-top:1.5rem">
        ${aboutPoints
          .map(
            (p) => `
          <li class="checklist-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ${p}
          </li>`,
          )
          .join('')}
      </ul>
      <div style="margin-top:2rem;display:flex;flex-wrap:wrap;gap:.75rem">
        <a href="courses.html" class="btn btn-hero btn-lg" id="about-explore-btn">
          Explore Courses
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:1rem;height:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
        </a>
        <a href="contact.html" class="btn btn-outline btn-lg" id="about-talk-btn">Talk to Us</a>
      </div>
    `;

      // Info Cards
      const infoCards = [
        {
          icon: featureIconSVGs.graduationCap,
          title: 'Our Approach',
          desc: 'Concepts explained clearly, followed by hands-on practice, examples and doubt clarification.',
        },
        {
          icon: icons.checkCircle,
          title: 'Who We Train',
          desc: 'Students, freshers and working professionals across programming, testing, SAP, data and cloud.',
        },
        {
          icon: icons.mapPin,
          title: 'Where We Are',
          desc:
            siteConfig.address.line1 +
            ', ' +
            siteConfig.address.city +
            ' — ' +
            siteConfig.address.pin,
        },
      ];
      document.getElementById('info-cards-grid').innerHTML = infoCards
        .map(
          (card) => `
      <div class="info-card">
        <div class="info-card-icon">${card.icon}</div>
        <h3>${card.title}</h3>
        <p>${card.desc}</p>
      </div>
    `,
        )
        .join('');
    </script>
  </body>
</html>
